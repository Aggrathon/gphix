[project]
name = "gphix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aggrathon", email = "antonbjo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gphix = "gphix:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=95"

[tool.coverage.run]
omit = [
    "tests/*"
]
